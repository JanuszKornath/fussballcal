server {
    # default_server ist hier entscheidend: Beim Zugriff über die IP des
    # Servers wird kein Host-Header auf einen server_name gematcht, nginx
    # nimmt dann den als default_server markierten vhost. Ohne das Flag gewinnt
    # Debians mitgelieferte Default-Site (/etc/nginx/sites-enabled/default) und
    # liefert die nginx-Welcome-Page aus. `server_name _` ist dabei kein
    # Wildcard, sondern nur ein bewusst ungültiger Platzhaltername.
    #
    # Deshalb muss die Debian-Default-Site deaktiviert sein, sonst bricht
    # `nginx -t` mit "duplicate default server for 0.0.0.0:80" ab:
    #   sudo rm /etc/nginx/sites-enabled/default
    #
    # Auf welchen Adressen dieser Port überhaupt aufgeht, entscheidet
    # LISTEN_ADDR beim Rollout: `sudo LISTEN_ADDR=10.0.0.42 scripts/deploy.sh`
    # macht daraus `listen 10.0.0.42:80`, und auf allen anderen Interfaces
    # existiert der Port dann schlicht nicht. Ohne die Variable bleibt es bei
    # allen Adressen — siehe README, "Absicherung im öffentlichen Netz".
    listen 80 default_server;
    server_name _;

    # Kein TLS an dieser Stelle, und das bleibt so: Zertifikate und
    # Domain-Routing gehören in einen vorgelagerten Reverse Proxy, der TLS
    # terminiert und hierher auf Port 80 weiterleitet. Dieser vhost ist dann
    # internes Backend. Im reinen Heim-/Vereinsnetz genügt er auch allein.
    # TLS direkt hier einzutragen lohnt nicht — deploy.sh schreibt die Datei
    # bei jedem Rollout aus dem Repo neu (siehe README, "TLS").

    # Außer dem Proxy hat hier niemand etwas verloren: Ist TRUSTED_PROXY beim
    # Rollout gesetzt, kommt alles, was nicht von dort stammt, gar nicht erst
    # an den Seiten an. Die Variable wird in
    # /etc/nginx/conf.d/fussballcal.conf gesetzt (von deploy.sh erzeugt); ohne
    # TRUSTED_PROXY ist sie konstant 0 und die Prüfung damit wirkungslos.
    #
    # Das ersetzt keine Firewall — es ist die zweite Schicht darunter, falls
    # der Server doch einmal direkt erreichbar ist.
    if ($fussballcal_untrusted_peer) {
        return 403;
    }

    # Version im Server-Header und in Fehlerseiten verschweigen. Verhindert
    # keinen Angriff, spart aber die frei Haus gelieferte Liste, welche
    # nginx-Lücken hier passen könnten.
    server_tokens off;

    root /var/www/fussballcal;
    # Startseite ist die öffentliche Kalenderübersicht — ohne Anmeldung, damit
    # die Abo-Links weitergegeben werden können.
    index index.php;

    # ICS-Dateien mit korrektem MIME-Type ausliefern.
    #
    # Das `^~` ist kein Schönheitsfehler: Ohne das Präfix gewinnt bei einer
    # Anfrage auf /ics/x.php die reguläre location weiter unten, und die Datei
    # ginge an PHP-FPM. Das Verzeichnis ist für den Webserver beschreibbar
    # (add_team.php löscht dort ICS-Dateien) — hier wird deshalb ausnahmslos
    # statisch ausgeliefert.
    location ^~ /ics/ {
        types { }
        default_type text/calendar;
        add_header Cache-Control "no-cache";

        # Neben jeder Kalenderdatei legt update_all.sh eine <slug>.state mit dem
        # Saisonstatus ab (die Seiten lesen sie, um "Saison beendet" anzuzeigen).
        # Das ist Interna und hat im Netz nichts zu suchen. Die Regel muss hier
        # hinein: das `^~` oben verhindert, dass Regex-locations außerhalb
        # dieses Blocks für /ics/ überhaupt geprüft werden.
        location ~ \.state$ { deny all; }
    }

    # Eintragen neuer Mannschaften nur mit Zugangsdaten.
    #
    # Diese exakte location (`=`) gewinnt gegen die Regex-location für *.php
    # weiter unten, deshalb steht die PHP-Weitergabe hier noch einmal.
    #
    # Die Passwortdatei legt scripts/set_password.sh an (deploy.sh ruft es beim
    # ersten Rollout mit einem Zufallspasswort auf). Fehlt sie, antwortet nginx
    # hier mit 500 — das ist Absicht: lieber kaputt als offen.
    #
    # REMOTE_USER steht nicht in nginx' fastcgi_params, wird also hier gesetzt.
    # Nur so sieht add_team.php, dass wirklich authentifiziert wurde (es bricht
    # sonst ab). Fälschen lässt sich der Wert nicht: HTTP-Header landen in PHP
    # als HTTP_*, nicht als REMOTE_USER.
    location = /add_team.php {
        auth_basic "Fussballcal - Eintragen nur mit Zugangsdaten";
        auth_basic_user_file /etc/nginx/fussballcal.htpasswd;

        # Bremse gegen Passwort-Raten. Basic Auth kennt keine Sperre nach n
        # Fehlversuchen — die kommt hier her: im Schnitt eine Anfrage pro
        # Sekunde, kurze Spitzen bis 5 werden durchgelassen (das Formular lädt
        # nur eine Seite, kein Bündel Assets). Wer schneller klopft, bekommt
        # 429. Die Zone steht in /etc/nginx/conf.d/fussballcal.conf.
        limit_req zone=fussballcal_login burst=5 nodelay;
        limit_req_status 429;

        include snippets/fastcgi-php.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/php/php-fpm.sock; # ggf. Version im Pfad ergänzen, z.B. php8.3-fpm.sock
    }

    # Interne Dateien: werden von den Seiten eingebunden, aber nie direkt
    # ausgeliefert (sie geben zwar nichts aus, haben aber auch nichts im Netz
    # zu suchen).
    location = /config.php { deny all; }
    location = /common.php { deny all; }

    # Öffentliche PHP-Seiten (index.php)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # PHP-FPM verrät im X-Powered-By-Header seine genaue Version. Für den
        # Browser ist der Header wertlos, für die Suche nach einer passenden
        # Lücke nicht — also raus damit (gilt nur für die Antwort ans Netz).
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php-fpm.sock; # ggf. Version im Pfad ergänzen, z.B. php8.3-fpm.sock
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
