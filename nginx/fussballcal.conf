server {
    # default_server ist hier entscheidend: Beim Zugriff über die IP des
    # Containers wird kein Host-Header auf einen server_name gematcht, nginx
    # nimmt dann den als default_server markierten vhost. Ohne das Flag gewinnt
    # Debians mitgelieferte Default-Site (/etc/nginx/sites-enabled/default) und
    # liefert die nginx-Welcome-Page aus. `server_name _` ist dabei kein
    # Wildcard, sondern nur ein bewusst ungültiger Platzhaltername.
    #
    # Deshalb muss die Debian-Default-Site deaktiviert sein, sonst bricht
    # `nginx -t` mit "duplicate default server for 0.0.0.0:80" ab:
    #   sudo rm /etc/nginx/sites-enabled/default
    listen 80 default_server;
    server_name _;

    # TLS und Domain-Routing werden zentral vom vorgelagerten Reverse Proxy
    # übernommen (der Traffic auf diesen Container weiterleitet). Dieser
    # vhost dient nur als internes Backend innerhalb des LXC-Containers.

    root /var/www/fussballcal;
    # Startseite ist die öffentliche Kalenderübersicht — ohne Anmeldung, damit
    # die Abo-Links weitergegeben werden können.
    index index.php;

    # ICS-Dateien mit korrektem MIME-Type ausliefern.
    #
    # Das `^~` ist kein Schönheitsfehler: Ohne das Präfix gewinnt bei einer
    # Anfrage auf /ics/x.php die reguläre location weiter unten, und die Datei
    # ginge an PHP-FPM. Das Verzeichnis ist für den Webserver beschreibbar
    # (add_team.php löscht dort ICS-Dateien) — hier wird deshalb ausnahmslos
    # statisch ausgeliefert.
    location ^~ /ics/ {
        types { }
        default_type text/calendar;
        add_header Cache-Control "no-cache";
    }

    # Eintragen neuer Mannschaften nur mit Zugangsdaten.
    #
    # Diese exakte location (`=`) gewinnt gegen die Regex-location für *.php
    # weiter unten, deshalb steht die PHP-Weitergabe hier noch einmal.
    #
    # Die Passwortdatei legt scripts/set_password.sh an (deploy.sh ruft es beim
    # ersten Rollout mit einem Zufallspasswort auf). Fehlt sie, antwortet nginx
    # hier mit 500 — das ist Absicht: lieber kaputt als offen.
    #
    # REMOTE_USER steht nicht in nginx' fastcgi_params, wird also hier gesetzt.
    # Nur so sieht add_team.php, dass wirklich authentifiziert wurde (es bricht
    # sonst ab). Fälschen lässt sich der Wert nicht: HTTP-Header landen in PHP
    # als HTTP_*, nicht als REMOTE_USER.
    location = /add_team.php {
        auth_basic "Fussballcal - Eintragen nur mit Zugangsdaten";
        auth_basic_user_file /etc/nginx/fussballcal.htpasswd;

        include snippets/fastcgi-php.conf;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_pass unix:/run/php/php-fpm.sock; # ggf. Version im Pfad ergänzen, z.B. php8.3-fpm.sock
    }

    # Interne Dateien: werden von den Seiten eingebunden, aber nie direkt
    # ausgeliefert (sie geben zwar nichts aus, haben aber auch nichts im Netz
    # zu suchen).
    location = /config.php { deny all; }
    location = /common.php { deny all; }

    # Öffentliche PHP-Seiten (index.php)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock; # ggf. Version im Pfad ergänzen, z.B. php8.3-fpm.sock
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
