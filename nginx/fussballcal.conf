server {
    # default_server ist hier entscheidend: Beim Zugriff über die IP des
    # Containers wird kein Host-Header auf einen server_name gematcht, nginx
    # nimmt dann den als default_server markierten vhost. Ohne das Flag gewinnt
    # Debians mitgelieferte Default-Site (/etc/nginx/sites-enabled/default) und
    # liefert die nginx-Welcome-Page aus. `server_name _` ist dabei kein
    # Wildcard, sondern nur ein bewusst ungültiger Platzhaltername.
    #
    # Deshalb muss die Debian-Default-Site deaktiviert sein, sonst bricht
    # `nginx -t` mit "duplicate default server for 0.0.0.0:80" ab:
    #   sudo rm /etc/nginx/sites-enabled/default
    listen 80 default_server;
    server_name _;

    # TLS und Domain-Routing werden zentral vom vorgelagerten Reverse Proxy
    # übernommen (der Traffic auf diesen Container weiterleitet). Dieser
    # vhost dient nur als internes Backend innerhalb des LXC-Containers.

    root /var/www/fussballcal;
    index add_team.php;

    # ICS-Dateien mit korrektem MIME-Type ausliefern
    location /ics/ {
        types { }
        default_type text/calendar;
        add_header Cache-Control "no-cache";
    }

    # PHP-Formular
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock; # ggf. Version im Pfad ergänzen, z.B. php8.3-fpm.sock
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
